# AIPMS Render Blueprint Specification
# Free-Tier Infrastructure as Code (IaC) for ₹0 Production & Staging Deployment on Render
# Runs a single unified Web Service hosting the API Gateway and internal domain microservices.
# Consumes exactly 1 Free Web Service (720 hrs/mo <= 750 free hrs limit) with zero hosting costs.

services:
  - type: web
    name: aipms-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    region: oregon
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
        # e.g. https://aipms.vercel.app,http://localhost:3008
      - key: AUTH_SERVICE_URL
        value: http://127.0.0.1:3001
      - key: PROJECT_SERVICE_URL
        value: http://127.0.0.1:3002
      - key: TEAM_SERVICE_URL
        value: http://127.0.0.1:3003
      - key: TASK_SERVICE_URL
        value: http://127.0.0.1:3004
      - key: SPRINT_SERVICE_URL
        value: http://127.0.0.1:3005
      - key: RISK_SERVICE_URL
        value: http://127.0.0.1:3006
      - key: REPORTING_SERVICE_URL
        value: http://127.0.0.1:3007
      - key: AI_SERVICE_URL
        value: http://127.0.0.1:3009
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: OLLAMA_BASE_URL
        sync: false
        # Leave empty on Render Free to run deterministic heuristic analysis without GPU host
      - key: OLLAMA_TIMEOUT_MS
        value: 30000
