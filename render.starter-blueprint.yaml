# AIPMS Render Blueprint Specification
# Infrastructure as Code (IaC) for Staging Deployment on Render
# API Gateway is public; domain microservices are private services (pserv)

services:
  # ─── Public Entry Point: API Gateway ───────────────────────────────────────
  - type: web
    name: aipms-api-gateway
    runtime: docker
    dockerfilePath: ./services/api-gateway/Dockerfile
    dockerContext: ./services/api-gateway
    region: oregon
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: staging
      - key: CORS_ORIGIN
        sync: false
        # e.g. https://aipms.vercel.app,https://aipms-staging.vercel.app
      - key: AUTH_SERVICE_URL
        value: http://aipms-auth-service:3001
      - key: PROJECT_SERVICE_URL
        value: http://aipms-project-service:3002
      - key: TEAM_SERVICE_URL
        value: http://aipms-team-service:3003
      - key: TASK_SERVICE_URL
        value: http://aipms-task-service:3004
      - key: SPRINT_SERVICE_URL
        value: http://aipms-sprint-service:3005
      - key: RISK_SERVICE_URL
        value: http://aipms-risk-service:3006
      - key: REPORTING_SERVICE_URL
        value: http://aipms-reporting-service:3007
      - key: AI_SERVICE_URL
        value: http://aipms-ai-service:3009
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

  # ─── Private Microservices (Internal Network Only) ─────────────────────────
  - type: pserv
    name: aipms-auth-service
    runtime: docker
    dockerfilePath: ./services/auth-service/Dockerfile
    dockerContext: ./services/auth-service
    region: oregon
    plan: starter
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: staging
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

  - type: pserv
    name: aipms-project-service
    runtime: docker
    dockerfilePath: ./services/project-service/Dockerfile
    dockerContext: ./services/project-service
    region: oregon
    plan: starter
    envVars:
      - key: PORT
        value: 3002
      - key: NODE_ENV
        value: staging
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

  - type: pserv
    name: aipms-team-service
    runtime: docker
    dockerfilePath: ./services/team-service/Dockerfile
    dockerContext: ./services/team-service
    region: oregon
    plan: starter
    envVars:
      - key: PORT
        value: 3003
      - key: NODE_ENV
        value: staging
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

  - type: pserv
    name: aipms-task-service
    runtime: docker
    dockerfilePath: ./services/task-service/Dockerfile
    dockerContext: ./services/task-service
    region: oregon
    plan: starter
    envVars:
      - key: PORT
        value: 3004
      - key: NODE_ENV
        value: staging
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

  - type: pserv
    name: aipms-sprint-service
    runtime: docker
    dockerfilePath: ./services/sprint-service/Dockerfile
    dockerContext: ./services/sprint-service
    region: oregon
    plan: starter
    envVars:
      - key: PORT
        value: 3005
      - key: NODE_ENV
        value: staging
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

  - type: pserv
    name: aipms-risk-service
    runtime: docker
    dockerfilePath: ./services/risk-service/Dockerfile
    dockerContext: ./services/risk-service
    region: oregon
    plan: starter
    envVars:
      - key: PORT
        value: 3006
      - key: NODE_ENV
        value: staging
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

  - type: pserv
    name: aipms-reporting-service
    runtime: docker
    dockerfilePath: ./services/reporting-service/Dockerfile
    dockerContext: ./services/reporting-service
    region: oregon
    plan: starter
    envVars:
      - key: PORT
        value: 3007
      - key: NODE_ENV
        value: staging
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
