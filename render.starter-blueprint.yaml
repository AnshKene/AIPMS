  - type: pserv
    name: aipms-ai-service
    runtime: docker
    dockerfilePath: ./services/ai-service/Dockerfile
    dockerContext: ./services/ai-service
    region: oregon
    plan: starter
    envVars:
      - key: PORT
        value: 3009
      - key: NODE_ENV
        value: staging
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: OLLAMA_BASE_URL
        sync: false
        # Point to external GPU host or leave empty to use deterministic fallback engine
      - key: OLLAMA_TIMEOUT_MS
        value: 30000
